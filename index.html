<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taller Hojalatería y Pintura — Sistema de Gestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <style>
        /* ... (estilos iguales) ... */
    </style>
</head>
<body>
    <!-- ... (HTML igual) ... -->
    
    <script>
        // ============================================================
        // CONFIGURACIÓN SUPABASE
        // ============================================================
        const SUPABASE_URL = 'https://jcknyppkhorqgoieafkh.supabase.co';
        const SUPABASE_ANON = 'sb_publishable_7QNcsHD2ojwIVUCwmuy5gw_1vk9_R-9';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

        // ============================================================
        // ESTADO GLOBAL
        // ============================================================
        let SESSION = null;
        let PERFIL = null;
        let confirmCallback = null;
        let otAsignarId = null;
        let origenTecnico = 'vista';
        let CONFIG = {};
        let detalleOTActual = null;

        // ========== UTILIDADES ==========
        function escHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
        }

        function toast(msg, tipo = '') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'show' + (tipo ? ' ' + tipo : '');
            if (tipo === 'err') t.style.background = '#ba0517';
            else if (tipo === 'ok') t.style.background = '#2e844a';
            else t.style.background = '#333';
            setTimeout(() => { t.className = ''; }, 3000);
        }

        function abrirConfirm(msg, callback, btnLabel = 'Confirmar') {
            confirmCallback = callback;
            document.getElementById('confirm-msg').textContent = msg;
            document.getElementById('confirm-ok').textContent = btnLabel;
            document.getElementById('mov-confirm').classList.add('open');
        }

        function cerrarConfirm() {
            document.getElementById('mov-confirm').classList.remove('open');
            confirmCallback = null;
        }

        function ejecutarConfirm() {
            if (confirmCallback) confirmCallback();
            cerrarConfirm();
        }

        document.getElementById('confirm-ok').addEventListener('click', ejecutarConfirm);

        // ========== AUTENTICACIÓN ==========
        async function initSession(userId) {
            try {
                const { data, error } = await sb.from('perfiles').select('*').eq('id', userId).single();
                if (error) { toast('Error al cargar perfil: ' + error.message, 'err'); return; }
                PERFIL = data;
                SESSION = { id: userId, email: data.email, rol: data.rol };
                await cargarConfiguracion();
                mostrarApp();
            } catch (e) { toast('Error al iniciar sesión: ' + e.message, 'err'); }
        }

        (async function boot() {
            sb.auth.onAuthStateChange(async (event, session) => {
                if (session?.user && !SESSION) await initSession(session.user.id);
                else if (!session && event === 'SIGNED_OUT') {
                    SESSION = null; PERFIL = null; CONFIG = {};
                    document.getElementById('app').style.display = 'none';
                    document.getElementById('login-wrap').style.display = 'flex';
                }
            });
            const { data: { session } } = await sb.auth.getSession();
            if (session?.user) await initSession(session.user.id);
        })();

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const { data, error } = await sb.auth.signInWithPassword({ email, password });
                if (error) throw error;
                toast('✅ Sesión iniciada', 'ok');
            } catch (err) { toast('❌ Error: ' + err.message, 'err'); }
        });

        // ========== CONFIGURACIÓN ==========
        async function cargarConfiguracion() {
            try {
                const { data, error } = await sb.from('configuracion_erp').select('*').eq('id', 1).single();
                if (error) { CONFIG = {}; return; }
                CONFIG = data || {};
                if (data) {
                    document.getElementById('cfg-nombre').value = data.empresa_nombre || '';
                    document.getElementById('cfg-rfc').value = data.empresa_rfc || '';
                    document.getElementById('cfg-direccion').value = data.empresa_direccion || '';
                    document.getElementById('cfg-telefono').value = data.empresa_telefono || '';
                    document.getElementById('cfg-email').value = data.empresa_email || '';
                    document.getElementById('cfg-web').value = data.empresa_web || '';
                    document.getElementById('cfg-banco').value = data.banco || '';
                    document.getElementById('cfg-cuenta').value = data.cuenta_bancaria || '';
                    document.getElementById('cfg-condiciones').value = data.condiciones_pago || '';
                    document.getElementById('cfg-terminos').value = data.terminos_cotizacion || '';
                }
            } catch (e) { console.warn('Error cargando configuración:', e.message); }
        }

        async function guardarConfig() {
            const cfg = {
                empresa_nombre: document.getElementById('cfg-nombre').value,
                empresa_rfc: document.getElementById('cfg-rfc').value,
                empresa_direccion: document.getElementById('cfg-direccion').value,
                empresa_telefono: document.getElementById('cfg-telefono').value,
                empresa_email: document.getElementById('cfg-email').value,
                empresa_web: document.getElementById('cfg-web').value,
                banco: document.getElementById('cfg-banco').value,
                cuenta_bancaria: document.getElementById('cfg-cuenta').value,
                condiciones_pago: document.getElementById('cfg-condiciones').value,
                terminos_cotizacion: document.getElementById('cfg-terminos').value
            };
            try {
                const { error } = await sb.from('configuracion_erp').upsert({ id: 1, ...cfg });
                if (error) throw error;
                await cargarConfiguracion();
                toast('Configuración guardada ✓', 'ok');
            } catch (e) { toast('Error: ' + e.message, 'err'); }
        }

        // ========== NAVEGACIÓN ==========
        function mostrarApp() {
            document.getElementById('login-wrap').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            document.getElementById('user-info').textContent = 'Usuario: ' + (PERFIL?.nombre || '');
            if (PERFIL?.rol === 'tecnico') { sb.auth.signOut(); return; }
            sv('dashboard');
            cargarDashboard();
        }

        function sv(view) {
            document.querySelectorAll('.view').forEach(v => v.style.display = 'none');
            document.querySelectorAll('.sidebar .nav-item').forEach(n => n.classList.remove('active'));
            const target = document.getElementById('view-' + view);
            if (target) target.style.display = 'block';
            const nav = document.querySelector('.sidebar .nav-item[data-view="' + view + '"]');
            if (nav) nav.classList.add('active');
            if (view === 'dashboard') cargarDashboard();
            if (view === 'nueva-ot') cargarDatosNuevaOT();
            if (view === 'cotizaciones') cargarCotizaciones();
            if (view === 'taller') cargarTaller();
            if (view === 'admin') cargarAdmin();
        }

        document.querySelectorAll('.sidebar .nav-item').forEach(item => {
            item.addEventListener('click', () => sv(item.dataset.view));
        });

        // ========== DASHBOARD ==========
        async function cargarDashboard() {
            try {
                const { count: taller } = await sb.from('ot').select('*', { count: 'exact', head: true }).eq('estado', 'en_taller');
                document.getElementById('stat-taller').textContent = taller || 0;
                const hoy = new Date().toISOString().split('T')[0];
                const { count: entregas } = await sb.from('ot').select('*', { count: 'exact', head: true })
                    .eq('estado', 'completada')
                    .gte('updated_at', hoy + 'T00:00:00')
                    .lt('updated_at', hoy + 'T23:59:59');
                document.getElementById('stat-entregas').textContent = entregas || 0;
                document.getElementById('stat-facturas').textContent = 0;
            } catch (e) { console.warn('Dashboard error:', e.message); }
        }

        // ========== CRUD GENÉRICO ==========
        const configs = {
            marca: { tabla: 'marcas', title: 'Marca', fields: [ { name: 'nombre', label: 'Nombre', type: 'text', required: true } ] },
            modelo: { tabla: 'modelos', title: 'Modelo', fields: [ { name: 'nombre', label: 'Nombre', type: 'text', required: true }, { name: 'marca_id', label: 'Marca', type: 'select', options: 'marcas' } ] },
            trabajo: { tabla: 'trabajos', title: 'Trabajo', fields: [ { name: 'nombre', label: 'Nombre', type: 'text', required: true }, { name: 'precio_base', label: 'Precio Base', type: 'number', step: '0.01' }, { name: 'tiempo_est', label: 'Tiempo Est. (min)', type: 'number' } ] },
            agencia: { tabla: 'agencias', title: 'Agencia', fields: [ { name: 'nombre', label: 'Nombre', type: 'text', required: true }, { name: 'rfc', label: 'RFC', type: 'text' }, { name: 'contacto', label: 'Contacto', type: 'text' } ] },
            cliente: { tabla: 'clientes', title: 'Cliente', fields: [ { name: 'nombre', label: 'Nombre', type: 'text', required: true }, { name: 'telefono', label: 'Teléfono', type: 'text' }, { name: 'email', label: 'Email', type: 'email' } ] }
        };

        let currentModal = null;
        let currentEditId = null;

        async function abrirModal(tipo, id = null) {
            const config = configs[tipo];
            if (!config) return;
            currentModal = tipo;
            currentEditId = id;
            document.getElementById('crud-title').textContent = id ? 'Editar ' + config.title : 'Nuevo ' + config.title;
            let html = '';
            for (const field of config.fields) {
                html += `<div style="margin-bottom:12px;"><label class="flbl">${field.label}</label>`;
                if (field.type === 'select') html += `<select class="inp" name="${field.name}" ${field.required ? 'required' : ''}><option value="">Selecciona...</option></select>`;
                else if (field.type === 'number') html += `<input class="inp" type="number" name="${field.name}" ${field.step ? 'step="' + field.step + '"' : ''} ${field.required ? 'required' : ''}>`;
                else html += `<input class="inp" type="${field.type || 'text'}" name="${field.name}" ${field.required ? 'required' : ''}>`;
                html += `</div>`;
            }
            document.getElementById('crud-body').innerHTML = html;
            if (id) {
                try {
                    const { data, error } = await sb.from(config.tabla).select('*').eq('id', id).single();
                    if (error) { toast('Error: ' + error.message, 'err'); return; }
                    for (const field of config.fields) {
                        const input = document.querySelector(`#crud-body input[name="${field.name}"], #crud-body select[name="${field.name}"]`);
                        if (input) input.value = data[field.name] || '';
                    }
                } catch (e) { toast('Error: ' + e.message, 'err'); return; }
            }
            if (tipo === 'modelo') {
                try {
                    const { data: marcas } = await sb.from('marcas').select('*').eq('activo', true);
                    const select = document.querySelector(`#crud-body select[name="marca_id"]`);
                    if (select && marcas) marcas.forEach(m => { const opt = document.createElement('option'); opt.value = m.id; opt.textContent = m.nombre; select.appendChild(opt); });
                } catch (e) { toast('Error cargando marcas: ' + e.message, 'err'); }
            }
            document.getElementById('mov-crud').classList.add('open');
        }

        function cerrarModal() { document.getElementById('mov-crud').classList.remove('open'); currentModal = null; currentEditId = null; }

        document.getElementById('crud-save').addEventListener('click', async () => {
            if (!currentModal) return;
            const config = configs[currentModal];
            const form = document.getElementById('crud-body');
            const datos = {};
            for (const field of config.fields) {
                const input = form.querySelector(`input[name="${field.name}"], select[name="${field.name}"]`);
                datos[field.name] = input ? input.value : '';
            }
            for (const field of config.fields) {
                if (field.required && !datos[field.name]) { toast('Campo ' + field.label + ' es obligatorio', 'err'); return; }
            }
            const vistaActual = currentModal;
            const vistaMap = { 'marca': 'marcas', 'modelo': 'modelos', 'trabajo': 'trabajos', 'agencia': 'agencias', 'cliente': 'clientes' };
            try {
                if (currentEditId) {
                    const { error } = await sb.from(config.tabla).update(datos).eq('id', currentEditId);
                    if (error) throw error;
                    toast('Actualizado ✓', 'ok');
                } else {
                    const { error } = await sb.from(config.tabla).insert(datos);
                    if (error) throw error;
                    toast('Creado ✓', 'ok');
                }
                cerrarModal();
                if (document.getElementById('view-admin').style.display !== 'none') cargarAdmin(); else sv(vistaMap[vistaActual] || vistaActual);
            } catch (e) { toast('Error: ' + e.message, 'err'); }
        });

        // ========== CARGAR CATÁLOGOS ==========
        async function cargarMarcas() {
            try {
                const { data, error } = await sb.from('marcas').select('*').eq('activo', true).order('nombre');
                if (error) { toast('Error: ' + error.message, 'err'); return; }
                const tbody = document.getElementById('tabla-marcas');
                tbody.innerHTML = '';
                data.forEach(m => tbody.innerHTML += `<tr><td>${m.id}</td><td>${escHtml(m.nombre)}</td><td>${m.activo ? 'Activo' : 'Inactivo'}</td><td class="text-right"><button class="btn btn-sm" onclick="abrirModal('marca', ${m.id})">Editar</button><button class="btn btn-sm btn-danger" onclick="eliminarRegistro('marcas', ${m.id}, '${escHtml(m.nombre)}')">Eliminar</button></td></tr>`);
            } catch (e) { toast('Error cargando marcas: ' + e.message, 'err'); }
        }

        async function cargarModelos() {
            try {
                const { data, error } = await sb.from('modelos').select('*, marcas(nombre)').eq('activo', true).order('nombre');
                if (error) { toast('Error: ' + error.message, 'err'); return; }
                const tbody = document.getElementById('tabla-modelos');
                tbody.innerHTML = '';
                data.forEach(m => tbody.innerHTML += `<tr><td>${m.id}</td><td>${escHtml(m.nombre)}</td><td>${escHtml(m.marcas?.nombre || '')}</td><td>${m.activo ? 'Activo' : 'Inactivo'}</td><td class="text-right"><button class="btn btn-sm" onclick="abrirModal('modelo', ${m.id})">Editar</button><button class="btn btn-sm btn-danger" onclick="eliminarRegistro('modelos', ${m.id}, '${escHtml(m.nombre)}')">Eliminar</button></td></tr>`);
            } catch (e) { toast('Error cargando modelos: ' + e.message, 'err'); }
        }

        async function cargarTrabajos() {
            try {
                const { data, error } = await sb.from('trabajos').select('*').eq('activo', true).order('nombre');
                if (error) { toast('Error: ' + error.message, 'err'); return; }
                const tbody = document.getElementById('tabla-trabajos');
                tbody.innerHTML = '';
                data.forEach(t => tbody.innerHTML += `<tr><td>${t.id}</td><td>${escHtml(t.nombre)}</td><td>$${t.precio_base || 0}</td><td>${t.tiempo_est || 0} min</td><td>${t.activo ? 'Activo' : 'Inactivo'}</td><td class="text-right"><button class="btn btn-sm" onclick="abrirModal('trabajo', ${t.id})">Editar</button><button class="btn btn-sm btn-danger" onclick="eliminarRegistro('trabajos', ${t.id}, '${escHtml(t.nombre)}')">Eliminar</button></td></tr>`);
            } catch (e) { toast('Error cargando trabajos: ' + e.message, 'err'); }
        }

        async function cargarAgencias() {
            try {
                const { data, error } = await sb.from('agencias').select('*').eq('activo', true).order('nombre');
                if (error) { toast('Error: ' + error.message, 'err'); return; }
                const tbody = document.getElementById('tabla-agencias');
                tbody.innerHTML = '';
                data.forEach(a => tbody.innerHTML += `<tr><td>${a.id}</td><td>${escHtml(a.nombre)}</td><td>${escHtml(a.rfc || '')}</td><td>${escHtml(a.contacto || '')}</td><td>${a.activo ? 'Activo' : 'Inactivo'}</td><td class="text-right"><button class="btn btn-sm" onclick="abrirModal('agencia', ${a.id})">Editar</button><button class="btn btn-sm btn-danger" onclick="eliminarRegistro('agencias', ${a.id}, '${escHtml(a.nombre)}')">Eliminar</button></td></tr>`);
            } catch (e) { toast('Error cargando agencias: ' + e.message, 'err'); }
        }

        async function cargarClientes() {
            try {
                const { data, error } = await sb.from('clientes').select('*').eq('activo', true).order('nombre');
                if (error) { toast('Error: ' + error.message, 'err'); return; }
                const tbody = document.getElementById('tabla-clientes');
                tbody.innerHTML = '';
                data.forEach(c => tbody.innerHTML += `<tr><td>${c.id}</td><td>${escHtml(c.nombre)}</td><td>${escHtml(c.telefono || '')}</td><td>${escHtml(c.email || '')}</td><td>${c.activo ? 'Activo' : 'Inactivo'}</td><td class="text-right"><button class="btn btn-sm" onclick="abrirModal('cliente', ${c.id})">Editar</button><button class="btn btn-sm btn-danger" onclick="eliminarRegistro('clientes', ${c.id}, '${escHtml(c.nombre)}')">Eliminar</button></td></tr>`);
            } catch (e) { toast('Error cargando clientes: ' + e.message, 'err'); }
        }

        async function eliminarRegistro(tabla, id, descripcion) {
            abrirConfirm(`¿Eliminar "${descripcion}"?`, async () => {
                try {
                    const { error } = await sb.from(tabla).update({ activo: false }).eq('id', id);
                    if (error) throw error;
                    toast('Eliminado ✓', 'ok');
                    cargarAdmin();
                } catch (e) { toast('Error: ' + e.message, 'err'); }
            }, 'Sí, eliminar');
        }

        // ========== ADMINISTRACIÓN ==========
        async function cargarAdmin() {
            const activeTab = document.querySelector('.tab-btn.active')?.dataset.tab || 'marcas';
            await Promise.all([cargarMarcas(), cargarModelos(), cargarTrabajos(), cargarAgencias(), cargarClientes(), cargarTecnicos(), cargarUsuarios()]);
            cambiarTabAdmin(activeTab);
        }

        function cambiarTabAdmin(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            const btn = document.querySelector(`.tab-btn[data-tab="${tab}"]`);
            if (btn) btn.classList.add('active');
            const content = document.getElementById('tab-' + tab);
            if (content) content.classList.add('active');
        }

        // ========== TÉCNICOS ==========
        async function cargarTecnicos() {
            try {
                const { data, error } = await sb.from('tecnicos').select('*').order('nombre');
                if (error) { toast('Error: ' + error.message, 'err'); return; }
                const tbody = document.getElementById('tabla-tecnicos');
                tbody.innerHTML = '';
                data.forEach(t => tbody.innerHTML += `<tr><td>${t.id}</td><td>${escHtml(t.nombre)}</td><td>${t.activo ? 'Activo' : 'Inactivo'}</td><td class="text-right"><button class="btn btn-sm" onclick="abrirEditarTecnico(${t.id})">Editar</button><button class="btn btn-sm btn-danger" onclick="cambiarEstadoTecnico(${t.id}, ${!t.activo})">${t.activo ? 'Desactivar' : 'Activar'}</button></td></tr>`);
            } catch (e) { toast('Error cargando técnicos: ' + e.message, 'err'); }
        }

        function abrirModalTecnico() { origenTecnico = 'vista'; document.getElementById('tec-nombre').value = ''; document.getElementById('mov-tecnico').classList.add('open'); }
        function abrirModalTecnicoDesdeAsignar() { origenTecnico = 'asignar'; document.getElementById('tec-nombre').value = ''; document.getElementById('mov-tecnico').classList.add('open'); }
        function cerrarModalTecnico() { document.getElementById('mov-tecnico').classList.remove('open'); }

        async function guardarTecnico() {
            const nombre = document.getElementById('tec-nombre').value.trim();
            if (!nombre) { toast('El nombre es obligatorio', 'err'); return; }
            try {
                const { error } = await sb.from('tecnicos').insert({ nombre, activo: true });
                if (error) throw error;
                toast('Técnico creado ✓', 'ok');
                cerrarModalTecnico();
                if (origenTecnico === 'asignar') {
                    const { data: tecnicos } = await sb.from('tecnicos').select('*').eq('activo', true).order('nombre');
                    const select = document.getElementById('select-tecnico');
                    select.innerHTML = '<option value="">— Sin técnico —</option>';
                    tecnicos.forEach(t => select.innerHTML += `<option value="${t.id}">${escHtml(t.nombre)}</option>`);
                } else { cargarTecnicos(); }
            } catch (e) { toast('Error: ' + e.message, 'err'); }
        }

        async function abrirEditarTecnico(id) {
            try {
                const { data } = await sb.from('tecnicos').select('*').eq('id', id).single();
                if (!data) return;
                const nuevoNombre = prompt('Nuevo nombre para ' + (data.nombre || ''), data.nombre);
                if (nuevoNombre && nuevoNombre.trim()) {
                    const { error } = await sb.from('tecnicos').update({ nombre: nuevoNombre.trim() }).eq('id', id);
                    if (error) { toast('Error: ' + error.message, 'err'); return; }
                    toast('Nombre actualizado ✓', 'ok');
                    cargarTecnicos();
                }
            } catch (e) { toast('Error: ' + e.message, 'err'); }
        }

        async function cambiarEstadoTecnico(id, nuevoEstado) {
            abrirConfirm('¿Cambiar estado del técnico?', async () => {
                try {
                    const { error } = await sb.from('tecnicos').update({ activo: nuevoEstado }).eq('id', id);
                    if (error) { toast('Error: ' + error.message, 'err'); return; }
                    toast('Estado actualizado ✓', 'ok');
                    cargarTecnicos();
                } catch (e) { toast('Error: ' + e.message, 'err'); }
            }, 'Sí, cambiar');
        }

        // ========== USUARIOS ==========
        async function cargarUsuarios() {
            try {
                const { data, error } = await sb.from('perfiles').select('*').order('nombre');
                if (error) { toast('Error: ' + error.message, 'err'); return; }
                const tbody = document.getElementById('tabla-usuarios');
                tbody.innerHTML = '';
                data.forEach(u => {
                    if (u.rol === 'tecnico') return;
                    tbody.innerHTML += `<tr><td>${u.id}</td><td>${escHtml(u.nombre)}</td><td>${escHtml(u.email || '')}</td><td>${u.rol}</td><td>${u.activo ? 'Activo' : 'Inactivo'}</td><td class="text-right"><button class="btn btn-sm" onclick="abrirEditarUsuario('${u.id}')">Editar</button><button class="btn btn-sm btn-danger" onclick="cambiarEstadoUsuario('${u.id}', ${!u.activo})">${u.activo ? 'Desactivar' : 'Activar'}</button></td></tr>`;
                });
            } catch (e) { toast('Error cargando usuarios: ' + e.message, 'err'); }
        }

        function abrirModalUsuario() {
            document.getElementById('usu-nombre').value = ''; document.getElementById('usu-email').value = ''; document.getElementById('usu-pass').value = '';
            document.getElementById('usu-rol').value = 'recepcionista';
            document.getElementById('mov-usuario').classList.add('open');
        }
        function cerrarModalUsuario() { document.getElementById('mov-usuario').classList.remove('open'); }

        async function guardarUsuario() {
            const nombre = document.getElementById('usu-nombre').value.trim();
            const email = document.getElementById('usu-email').value.trim();
            const pass = document.getElementById('usu-pass').value;
            const rol = document.getElementById('usu-rol').value;
            if (!nombre || !email || !pass) { toast('Todos los campos son obligatorios', 'err'); return; }
            if (pass.length < 8) { toast('La contraseña debe tener al menos 8 caracteres', 'err'); return; }
            try {

        // ★★★ FUNCIÓN generarCodigoOT (declarada como function para que sea global) ★★★
        function generarCodigoOT() {
            const tipoCliente = document.getElementById('ot-tipo-cliente').value;
            let agenciaCodigo = 'PAR';
            if (tipoCliente === 'agencia') {
                const selAgencia = document.getElementById('ot-cliente-agencia');
                const agenciaNombre = selAgencia.options[selAgencia.selectedIndex]?.dataset?.nombre || '';
                agenciaCodigo = agenciaNombre.replace(/[^a-zA-Z]/g, '').substring(0, 3).toUpperCase();
                if (agenciaCodigo.length < 3) agenciaCodigo = agenciaCodigo.padEnd(3, 'X');
            }
            const hoy = new Date();
            const dd = String(hoy.getDate()).padStart(2, '0');
            const mm = String(hoy.getMonth() + 1).padStart(2, '0');
            const aa = String(hoy.getFullYear()).slice(-2);
            const fecha = dd + mm + aa;
            const selMarca = document.getElementById('ot-marca');
            const marcaNombre = selMarca.options[selMarca.selectedIndex]?.dataset?.nombre || '';
            const marcaCodigo = marcaNombre.replace(/[^a-zA-Z]/g, '').substring(0, 2).toUpperCase();
            const selModelo = document.getElementById('ot-modelo');
            const modeloNombre = selModelo.options[selModelo.selectedIndex]?.dataset?.nombre || '';
            const modeloCodigo = modeloNombre.replace(/[^a-zA-Z]/g, '').substring(0, 2).toUpperCase();
            return agenciaCodigo + fecha + marcaCodigo + modeloCodigo;
        }

        // Generadores de folio
        async function generarFolioCotizacion() {
            const anio = new Date().getFullYear();
            const prefijo = `CT-${anio}-`;
            try {
                const { data: existentes } = await sb.from('ot').select('numero').like('numero', prefijo + '%').order('numero', { ascending: false }).limit(1);
                let consecutivo = 1;
                if (existentes && existentes.length > 0) consecutivo = parseInt(existentes[0].numero.replace(prefijo, '')) + 1;
                return prefijo + String(consecutivo).padStart(3, '0');
            } catch (e) { return prefijo + Date.now().toString().slice(-3); }
        }

        // ★★★ Función guardarCotizacion ★★★
        async function guardarCotizacion() {
            try {
                const placa = document.getElementById('ot-placa').value.trim();
                const anio = document.getElementById('ot-anio').value || null;
                const marcaId = document.getElementById('ot-marca').value;
                const modeloId = document.getElementById('ot-modelo').value;
                const tipoCliente = document.getElementById('ot-tipo-cliente').value;
                const clienteParticularId = document.getElementById('ot-cliente-particular').value || null;
                const clienteAgenciaId = document.getElementById('ot-cliente-agencia').value || null;

                if (!placa) { toast('Ingresa la placa', 'err'); return; }
                if (!marcaId) { toast('Selecciona una marca', 'err'); return; }
                if (!modeloId) { toast('Selecciona un modelo', 'err'); return; }
                if (tipoCliente === 'particular' && !clienteParticularId) { toast('Selecciona el cliente particular', 'err'); return; }
                if (tipoCliente === 'agencia' && !clienteAgenciaId) { toast('Selecciona la agencia', 'err'); return; }

                const trabajosSeleccionados = [];
                let costoTotal = 0, tiempoTotal = 0;
                document.querySelectorAll('.chk-trabajo:checked').forEach(chk => {
                    trabajosSeleccionados.push({ trabajo_id: parseInt(chk.value), precio: parseFloat(chk.dataset.precio || 0) });
                    costoTotal += parseFloat(chk.dataset.precio || 0);
                    tiempoTotal += parseInt(chk.dataset.tiempo || 0);
                });

                if (trabajosSeleccionados.length === 0) { toast('Selecciona al menos un trabajo', 'err'); return; }

                const numero = await generarFolioCotizacion();
                const codigo = generarCodigoOT();
                const vigencia = new Date(Date.now() + 15 * 86400000).toISOString().split('T')[0];

                const otData = {
                    placa, anio: anio || null, marca_id: marcaId, modelo_id: modeloId,
                    cliente_tipo: tipoCliente,
                    agencia_id: tipoCliente === 'agencia' ? clienteAgenciaId : null,
                    cliente_id: tipoCliente === 'particular' ? clienteParticularId : null,
                    costo_total: costoTotal, tiempo_est: tiempoTotal,
                    estado: 'cotizacion',
                    flujo_trabajo: JSON.stringify(trabajosSeleccionados.map(t => t.trabajo_id)),
                    numero: numero,
                    vigencia: vigencia,
                    codigo: codigo
                };

                const { data, error } = await sb.from('ot').insert(otData).select().single();
                if (error) throw error;

                for (const t of trabajosSeleccionados) {
                    const { error: errItem } = await sb.from('ot_trabajos').insert({ ot_id: data.id, trabajo_id: t.trabajo_id, precio: t.precio });
                    if (errItem) throw errItem;
                }

                toast('Cotización ' + numero + ' creada ✓', 'ok');
                document.getElementById('form-nueva-ot').reset();
                sv('cotizaciones');
            } catch (e) {
                console.error('Error en guardarCotizacion:', e);
                toast('Error: ' + e.message, 'err');
            }
        }

        // ========== PDF ==========
        function numeroALetras(numero) {
            const unidades = ['','UN','DOS','TRES','CUATRO','CINCO','SEIS','SIETE','OCHO','NUEVE','DIEZ','ONCE','DOCE','TRECE','CATORCE','QUINCE','DIECISÉIS','DIECISIETE','DIECIOCHO','DIECINUEVE'];
            const decenas = ['','DIEZ','VEINTE','TREINTA','CUARENTA','CINCUENTA','SESENTA','SETENTA','OCHENTA','NOVENTA'];
            const centenas = ['','CIENTO','DOSCIENTOS','TRESCIENTOS','CUATROCIENTOS','QUINIENTOS','SEISCIENTOS','SETECIENTOS','OCHOCIENTOS','NOVECIENTOS'];
            function grupo(n) {
                if(n === 0) return '';
                if(n === 100) return 'CIEN';
                let r = '';
                const c = Math.floor(n/100), d = Math.floor((n%100)/10), u = n%10;
                if(c) r += centenas[c] + ' ';
                if(n%100 < 20 && n%100 > 0) r += unidades[n%100];
                else { if(d) r += decenas[d] + (u?' Y ':''); if(u) r += unidades[u]; }
                return r.trim();
            }
            const entero = Math.floor(numero);
            const centavos = Math.round((numero - entero) * 100);
            let texto = '';
            const millones = Math.floor(entero/1000000);
            const miles = Math.floor((entero%1000000)/1000);
            const resto = entero % 1000;
            if(entero === 0) texto = 'CERO';
            else {
                if(millones === 1) texto += 'UN MILLÓN ';
                else if(millones > 1) texto += grupo(millones) + ' MILLONES ';
                if(miles === 1) texto += 'MIL ';
                else if(miles > 1) texto += grupo(miles) + ' MIL ';
                if(resto) texto += grupo(resto);
            }
            return `${texto.trim()} PESOS ${String(centavos).padStart(2,'0')}/100 M.N.`;
        }

        async function imprimirCotizacion(otId) {
            try {
                const { data: ot, error: e1 } = await sb.from('ot').select('*, marcas(nombre), modelos(nombre), clientes(nombre), agencias(nombre)').eq('id', otId).single();
                if (e1) { toast('Error: ' + e1.message, 'err'); return; }
                const { data: items, error: e2 } = await sb.from('ot_trabajos').select('*, trabajos(nombre)').eq('ot_id', otId);
                if (e2) { toast('Error: ' + e2.message, 'err'); return; }

                const cliente = ot.cliente_tipo === 'agencia' ? ot.agencias : ot.clientes;
                const doc = new jspdf.jsPDF('p', 'mm', 'a4');
                const M = 15;
                let finalY = M;

                if (CONFIG.logo_base64) {
                    doc.addImage(CONFIG.logo_base64, 'PNG', M, M, 55, 18);
                    finalY = M + 22;
                } else {
                    doc.setFontSize(16);
                    doc.setFont('helvetica', 'bold');
                    doc.text(CONFIG.empresa_nombre || 'Taller', M, M + 8);
                    finalY = M + 14;
                }

                doc.setFontSize(9);
                doc.setFont('helvetica', 'normal');
                doc.text(CONFIG.empresa_rfc || '', M, finalY);
                finalY += 4;
                doc.text(CONFIG.empresa_direccion || '', M, finalY);
                finalY += 4;
                doc.text(`${CONFIG.empresa_telefono || ''} · ${CONFIG.empresa_email || ''}`, M, finalY);
                finalY += 4;
                doc.text(CONFIG.empresa_web || '', M, finalY);

                finalY = M + 30;
                doc.setFillColor(10, 15, 44);
                doc.rect(M, finalY, 180, 8, 'F');
                doc.setTextColor(255);
                doc.setFontSize(12);
                doc.setFont('helvetica', 'bold');
                doc.text('COTIZACIÓN', M + 2, finalY + 5.5);
                doc.setTextColor(0);
                finalY += 14;

                const boxY = finalY;
                doc.setDrawColor(0);
                doc.roundedRect(M, boxY, 90, 30, 2, 2);
                doc.roundedRect(105, boxY, 90, 30, 2, 2);
                doc.setFontSize(8);
                doc.setFont('helvetica', 'bold');
                doc.text('CLIENTE', M + 2, boxY + 5);
                doc.text('DATOS DE COTIZACIÓN', 107, boxY + 5);
                doc.setFont('helvetica', 'normal');
                doc.text(ot.cliente_tipo === 'agencia' ? (ot.agencias?.nombre || '') : (ot.clientes?.nombre || ''), M + 2, boxY + 12);
                doc.text(cliente?.telefono || '', M + 2, boxY + 16);
                doc.text(cliente?.email || '', M + 2, boxY + 20);
                doc.text(cliente?.direccion || '', M + 2, boxY + 24);
                doc.text(ot.numero || '', 107, boxY + 12);
                doc.text('Fecha: ' + (ot.created_at ? new Date(ot.created_at).toLocaleDateString() : ''), 107, boxY + 16);
                doc.text('Vigencia: ' + (ot.vigencia || ''), 107, boxY + 20);
                doc.text('Vendedor: ' + (PERFIL?.nombre || ''), 107, boxY + 24);
                finalY = boxY + 35;

                const tableBody = items.map((it, i) => [i+1, it.trabajos?.nombre || '', it.cantidad || 1, it.precio || 0, it.importe || it.precio || 0]);
                doc.autoTable({
                    startY: finalY,
                    head: [['#', 'Descripción', 'Cant.', 'P. Unitario', 'Total']],
                    body: tableBody,
                    theme: 'striped',
                    headStyles: { fillColor: [10, 15, 44] },
                    styles: { fontSize: 9 },
                    margin: { left: M, right: M }
                });
                finalY = doc.lastAutoTable.finalY + 5;

                const total = ot.costo_total || 0;
                const subtotal = total;
                doc.text('Subtotal: $' + subtotal.toFixed(2), 130, finalY);
                finalY += 5;
                doc.text('TOTAL: $' + total.toFixed(2), 130, finalY);
                finalY += 8;

                doc.setFont('helvetica', 'italic');
                doc.text('Son: ' + numeroALetras(total), M, finalY);
                finalY += 10;

                doc.setFont('helvetica', 'normal');
                doc.setFontSize(8);
                doc.text(CONFIG.terminos_cotizacion || '', M, finalY, { maxWidth: 180 });
                finalY += 20;

                doc.setFillColor(10, 15, 44);
                doc.rect(0, 285, 210, 12, 'F');
                doc.setTextColor(255);
                doc.text(CONFIG.empresa_nombre || 'Taller', 105, 293, { align: 'center' });

                doc.save(ot.numero + '.pdf');
            } catch (e) { toast('Error generando PDF: ' + e.message, 'err'); }
        }

        // ========== WHATSAPP ==========
        function copiarResumenWhatsApp() {
            if (!detalleOTActual) return;
            const ot = detalleOTActual;
            const cliente = ot.cliente_tipo === 'agencia' ? 'Agencia' : 'Cliente';
            let txt = `*Resumen de ${ot.numero || ot.codigo}*\n`;
            txt += `Placa: ${ot.placa}\n`;
            txt += `Cliente: ${cliente}\n`;
            txt += `Total: $${ot.costo_total || 0}\n`;
            txt += `Estado: ${ot.estado}\n`;
            navigator.clipboard.writeText(txt);
            toast('Resumen copiado ✓', 'ok');
        }

        // ========== CONSULTA PÚBLICA PARA TÉCNICO ==========
        async function abrirConsultaTecnico() {
            document.getElementById('login-wrap').style.display = 'none';
            document.getElementById('consulta-tecnico-wrap').style.display = 'block';
            try {
                const { data: tecnicos } = await sb.from('tecnicos').select('*').eq('activo', true).order('nombre');
                const select = document.getElementById('select-consulta-tecnico');
                select.innerHTML = '<option value="">Selecciona...</option>';
                tecnicos.forEach(t => select.innerHTML += `<option value="${t.id}">${escHtml(t.nombre)}</option>`);
                document.getElementById('consulta-tareas-lista').innerHTML = '';
            } catch (e) { toast('Error: ' + e.message, 'err'); }
        }

        function cerrarConsultaTecnico() {
            document.getElementById('consulta-tecnico-wrap').style.display = 'none';
            document.getElementById('login-wrap').style.display = 'flex';
        }

        async function cargarTareasConsulta() {
            const tecnicoId = document.getElementById('select-consulta-tecnico').value;
            const cont = document.getElementById('consulta-tareas-lista');
            cont.innerHTML = '';
            if (!tecnicoId) return;
            try {
                const { data, error } = await sb.from('ot')
                    .select('*, marcas(nombre), modelos(nombre), clientes(nombre), agencias(nombre)')
                    .eq('tecnico_id', tecnicoId)
                    .in('estado', ['aprobada', 'en_taller'])
                    .order('updated_at', { ascending: false });
                if (error) { toast('Error: ' + error.message, 'err'); return; }
                if (data.length === 0) { cont.innerHTML = '<p style="text-align:center; color:var(--sf-text-secondary); padding:20px;">No tienes tareas asignadas.</p>'; return; }
                data.forEach(ot => {
                    const clienteNombre = ot.cliente_tipo === 'agencia' ? (ot.agencias?.nombre || '') : (ot.clientes?.nombre || '');
                    let badge = '';
                    if (ot.estado === 'aprobada') badge = '<span class="badge-aprobada">Pendiente de iniciar</span>';
                    else if (ot.estado === 'en_taller') badge = '<span class="badge-en-taller">En proceso</span>';
                    cont.innerHTML += `<div class="mis-tarea-item"><div><strong>${escHtml(ot.placa)}</strong> — ${escHtml(clienteNombre)}<br><small class="card-codigo">${escHtml(ot.numero || ot.codigo || '')}</small></div><div>${badge}</div></div>`;
                });
            } catch (e) { toast('Error: ' + e.message, 'err'); }
        }
    </script>
